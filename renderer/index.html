<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' romm-img: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>RomM Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="menubar">
    <a data-menu="settings">Settings</a>
    <a data-menu="about">About</a>
    <a id="menu-fullscreen" data-menu="fullscreen" title="Full screen on/off (F11; Esc leaves it)">⛶ Full screen</a>
    <span class="spacer"></span>
    <a id="menu-sync" data-menu="sync" title="Sync emulator save folders with WebDAV" hidden>⟳ Sync saves</a>
    <a id="menu-user" data-menu="user" title="RomM account the launcher signs in with (Settings → Server)" hidden></a>
    <!-- Full screen has no window title bar: this closes the launcher, which starts full screen again next time. -->
    <a id="menu-quit" data-menu="quit" title="Close RomM Launcher (it opens full screen again next time)" hidden>✕ Exit</a>
  </nav>
  <div id="app">
  <aside id="sidebar">
    <div class="brand"><img src="icon.png" alt="">RomM <span>Launcher</span></div>
    <div class="search"><input id="search" type="search" placeholder="Search all games…" title="Ctrl+Shift+F"></div>
    <!-- Pinned: only the platform list below scrolls. -->
    <nav class="side-pinned">
      <a data-view="home" class="nav-item"><span class="ico">⌂</span>Home</a>
      <a data-view="all" class="nav-item"><span class="ico">▦</span>All games</a>
      <a data-view="installed" class="nav-item"><span class="ico">✓</span>Downloaded</a>
      <a data-view="collections" class="nav-item"><span class="ico">❏</span>Collections</a>
    </nav>
    <div class="section-title">Platforms</div>
    <div class="side-scroll">
      <nav id="platforms"><div class="muted pad">Loading…</div></nav>
    </div>
  </aside>

  <main id="main">
    <div id="offline-banner" role="status" hidden>
      <span>RomM cannot be reached. Your downloaded games still play; saves upload when it is back.</span>
      <button id="offline-retry">Retry now</button>
    </div>
    <div id="update-banner" role="status" hidden></div>
    <header id="toolbar">
      <h1 id="view-title">All games</h1>
      <span id="view-count" class="muted"></span>
      <div class="spacer"></div>
      <input id="view-search" type="search" placeholder="Search…" title="Ctrl+F">
      <button id="filter-btn" title="RomM filters">Filters <span id="filter-count" class="pill" hidden></span></button>
      <select id="sort">
        <option value="name:asc">Name A→Z</option>
        <option value="name:desc">Name Z→A</option>
        <option value="favorite:first">Favourites first</option>
        <option value="created_at:desc">Recently added</option>
        <option value="first_release_date:desc">Release date</option>
        <option value="fs_size_bytes:desc">Size</option>
      </select>
      <div class="viewmode" role="group" aria-label="View">
        <button data-mode="grid" title="Covers">▦</button>
        <button data-mode="list" title="Details">☰</button>
      </div>
      <input id="zoom" type="range" min="120" max="260" value="170" title="Cover size">
    </header>
    <div id="filter-panel" hidden></div>
    <section id="content">
      <div id="home" hidden></div>
      <div id="grid"></div>
      <div id="list-foot"></div>
      <div id="empty" class="empty" hidden></div>
    </section>
    <section id="settings" hidden></section>
    <section id="about" hidden></section>
  </main>
  </div>

  <div id="detail" class="drawer" hidden></div>
  <div id="chooser" hidden></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
